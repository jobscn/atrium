function appIcon(id){const brand=id==='music'?'netease':id==='bili'?'bilibili':null;return brand?'<img class="app-icon" src="'+brandIcons[brand]+'" alt="">':svg(id,'app-icon generic')}
function panelArt(id){if(id==='bili')return '<img class="panel-logo wordmark" src="'+biliWordmark+'" alt="">';if(id==='music')return '<svg class="panel-logo netease-wordmark" viewBox="0 15 160 42" aria-hidden="true"><image width="240" height="212" href="'+neteaseSprite+'"/></svg>';return svg(id,'panel-glyph')}
const defaults=()=>({favorites:['video','bili','music','local','live','files'],order:catalog.map(a=>a.id),theme:'forest',provider:null,defaultHome:'xiaomi',recent:[],lastSource:null});let state=defaults(),storageOK=true;
try{const s=JSON.parse(localStorage.getItem('tvhome-demo-v1')||'null');if(s&&typeof s==='object'){for(const key of ['favorites','order'])if(Array.isArray(s[key]))state[key]=[...new Set(s[key].filter(id=>catalog.some(a=>a.id===id)))];state.order=[...state.order,...catalog.map(a=>a.id).filter(id=>!state.order.includes(id))];if(['forest','warm','midnight'].includes(s.theme))state.theme=s.theme;if(s.provider==='sockstun')state.provider=s.provider;if(['xiaomi','custom'].includes(s.defaultHome))state.defaultHome=s.defaultHome;if(Array.isArray(s.recent))state.recent=[...new Set(s.recent.filter(id=>catalog.some(a=>a.id===id)))].slice(0,3);if(['netease','local'].includes(s.lastSource))state.lastSource=s.lastSource;}}catch(e){storageOK=false}
let vpnState='disconnected',vpnTimer=null;const $=s=>document.querySelector(s);let page='favorites',opener=null,openerId=null,toastTimer,backAction=null;const dialog=$('#dialog');
function save(){try{localStorage.setItem('tvhome-demo-v1',JSON.stringify(state))}catch(e){storageOK=false;toast('浏览器禁止保存，设置仅在本次页面有效。')}}
function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function render(){document.body.dataset.theme=state.theme;renderVpn();$('#favTab').classList.toggle('active',page==='favorites');$('#allTab').classList.toggle('active',page==='all');$('#favTab').setAttribute('aria-pressed',page==='favorites');$('#allTab').setAttribute('aria-pressed',page==='all');$('#sectionTitle').innerHTML=page==='favorites'?'常用应用':'全部应用';const ids=state.order.filter(id=>page==='all'||state.favorites.includes(id));$('#apps').replaceChildren();for(const id of ids){const a=catalog.find(x=>x.id===id),b=document.createElement('button');b.className='app';b.id='app-'+id;b.dataset.id=id;b.setAttribute('aria-label',a.name);b.style.setProperty('--tile',a.color);b.innerHTML='<span class="art panel-'+id+'">'+panelArt(id)+'</span><span class="app-name">'+a.name+'</span><span class="app-kind">'+a.kind+'</span>';b.onclick=()=>launch(a);$('#apps').append(b)}if(!ids.length){$('#apps').innerHTML='<div class="empty">还没有收藏应用。整理应用即可添加。</div>'}renderRecent();renderMedia();}
function show(title,html,back=null){backAction=back;if(!dialog.open){opener=document.activeElement;openerId=opener.id||null;}$('#dialogTitle').textContent=title;$('#content').innerHTML=html;if(!dialog.open)dialog.showModal();$('#close').focus()}
function close(){dialog.close();if(opener&&opener.isConnected)opener.focus();else if(openerId&&document.getElementById(openerId))document.getElementById(openerId).focus();else if(openerId&&openerId.startsWith('media'))($('#mediaOpen')||$('#mediaToggle')).focus();else $('#favTab').focus()}

function homeChoice(parentBack=settings){show('更改默认桌面','<p class="dialog-sub">流程演示 · 需用户确认，不能静默接管。</p><div class="notice">正式版本将请求可用的系统 Home 选择界面；取消保留原设置。此处只改变原型中的显示，不会修改电视。</div><div class="actions"><button id="chooseCustom">选择电视桌面</button><button id="chooseXiaomi">选择小米桌面</button><button id="choiceCancel">取消</button></div>',parentBack);for(const [id,value,name] of [['chooseCustom','custom','电视桌面'],['chooseXiaomi','xiaomi','小米桌面']])bind(id,()=>{state.defaultHome=value;save();settings();toast('演示默认桌面：'+name+'（非系统设置）')});bind('choiceCancel',parentBack)}

let media=emptyMedia(),mediaDemoEnabled=false;const sources={netease:{name:'网易云音乐',icon:'netease',app:'music'},local:{name:'本地播放',app:'local'}};
const tracks=[{title:'山间来信',artist:'轻音乐 · 示例曲目'},{title:'晚风留声',artist:'器乐 · 示例曲目'},{title:'远处的灯',artist:'氛围音乐 · 示例曲目'}];
function renderRecent(){const el=$('#recent');el.replaceChildren();const recent=state.recent.filter(id=>!state.favorites.includes(id));if(!recent.length)return;const label=document.createElement('span');label.textContent='最近打开';el.append(label);for(const id of recent){const a=catalog.find(x=>x.id===id),b=document.createElement('button');b.style.setProperty('--tile',a.color);b.innerHTML=appIcon(id)+'<span>'+a.name+'</span>';b.onclick=()=>launch(a);el.append(b)}}

function renderMedia(){const el=$('#mediaCard');if(!el)return;const focused=el.contains(document.activeElement)?document.activeElement.id:null,live=media.sessionStatus==='live',cap=media.capabilities,controllable=live&&(media.playback==='playing'?cap.pause:cap.play),source=sources[(live||media.sessionStatus==='lost')?media.sourceId:state.lastSource],t=tracks[media.index];const title=live||media.sessionStatus==='lost'?t.title:(source?source.name:'音乐'),status=live?(media.playback==='playing'?'播放中':'已暂停'):(source?'会话不可用':'');let controls='';if(controllable){controls='<div class="transport">'+(cap.previous?'<button id="mediaPrevious" aria-label="上一首">'+svg('prev')+'</button>':'')+'<button id="mediaToggle" class="main-control" aria-label="'+(media.playback==='playing'?'暂停':'继续播放')+'">'+svg(media.playback==='playing'?'pause':'play')+'</button>'+(cap.next?'<button id="mediaNext" aria-label="下一首">'+svg('next')+'</button>':'')+'</div>'}else controls='<button id="mediaOpen" class="media-open" aria-label="'+(source?'打开'+source.name:'选择播放器')+'">'+(source?'打开':'选择播放器')+'</button>';el.innerHTML='<div class="media-head"><span>'+(controllable?(media.playback==='playing'?'正在播放':'继续播放'):'播放器')+' <span class="media-label">示例</span></span></div><div class="media-main"><div class="cover '+(live||media.sessionStatus==='lost'?(media.index%2?'alternate':''):'empty')+'"><span class="rings"></span>'+svg('music')+'</div><div class="media-copy"><div class="media-title">'+title+'</div>'+(live||media.sessionStatus==='lost'?'<div class="media-meta">'+t.artist+'</div>':'')+'<div class="source-line">'+(source&&source.icon?'<img src="'+brandIcons[source.icon]+'" alt="">':'')+(live&&source?source.name+' · ':'')+status+'</div></div>'+controls+'</div>';if(controllable){bind('mediaToggle',()=>{media.playback=media.playback==='playing'?'paused':'playing';renderMedia();$('#mediaToggle').focus()});for(const [id,d,allowed] of [['mediaPrevious',-1,cap.previous],['mediaNext',1,cap.next]])if(allowed)bind(id,() function remoteNavigation(e){if(dialog.open){if($('#dialogTitle').textContent==='选择播放器'){const map={close:{ArrowDown:'source-netease'},'source-netease':{ArrowUp:'close',ArrowDown:'source-local'},'source-local':{ArrowUp:'source-netease',ArrowDown:'source-local'}};const next=map[document.activeElement.id]?.[e.key];if(next){focusId(next);return true}}return false;}const id=document.activeElement?.id,k=e.key,apps=[...document.querySelectorAll('#apps .app')];const firstApp=apps[0]?.id||'manage';if(k==='Escape'&&document.activeElement.closest('#mediaCard')){focusId(mediaReturnId)||focusId(firstApp);return true}

function clock(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('#date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}clock();let clockTimer;function scheduleClock(){clearTimeout(clockTimer);if(!document.hidden){clock();clockTimer=setTimeout(scheduleClock,60000-Date.now()%60000)}}document.addEventListener('visibilitychange',scheduleClock);scheduleClock();
document.addEventListener('keydown',e=>{if(remoteNavigation(e)){e.preventDefault();return}if(e.key==='Escape'&&!dialog.open){e.preventDefault();if(page==='all'){page='favorites';render();$('#favTab').focus()}return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const scope=dialog.open?dialog:document.querySelector('main'),nodes=[...scope.querySelectorAll('button:not(:disabled)')].filter(n=>n.getClientRects().length);if(!nodes.includes(document.activeElement)){nodes[0]?.focus();return}const r=document.activeElement.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2,h=e.key==='ArrowLeft'||e.key==='ArrowRight',sign=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;let best=null,score=Infinity;for(const n of nodes){if(n===document.activeElement)continue;const t=n.getBoundingClientRect(),dx=t.x+t.width/2-x,dy=t.y+t.height/2-y,primary=(h?dx:dy)*sign,secondary=Math.abs(h?dy:dx);if(primary<3)continue;const s=primary+secondary*3;if(s<score){score=s;best=n}}best?.focus()});render();$('#vpnPower').innerHTML=svg('power');$('#settings').innerHTML=svg('settings');$('#vpn .quick-icon').innerHTML=svg('sockstun');$('#xiaomi .quick-icon').innerHTML=svg('home');$('#system .quick-icon').innerHTML=svg('settings');
