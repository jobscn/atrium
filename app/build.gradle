plugins { id 'com.android.application' }
android {
    namespace 'dev.jobscn.tvhome'
    compileSdk 34
    defaultConfig { applicationId 'dev.jobscn.tvhome'; minSdk 28; targetSdk 34; versionCode 2; versionName '0.1.1' }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
